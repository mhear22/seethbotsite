<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ mald.mikahear.es ✨</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <link rel="stylesheet" href="styles.css">

</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createApp, ref, onMounted, computed } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js';

    // Import components
    import { MainApp } from './components/MainApp.js';
    import { Router } from './components/Router.js';

    createApp({
      setup() {
        // State
        const currentRoute = ref('home');
        const darkMode = ref(false);
        const musicPlaying = ref(false);
        const feedOpen = ref(false);
        const currentQuoteIndex = ref(0);
        const tachValue = ref(77);
        const fartClicked = ref(false);
        const fartExploded = ref(false);
        const mikaModalOpen = ref(false);
        const confirmationOpen = ref(false);
        const panelOpen = ref({
          rankings: true,
          cat: true,
          feed: false
        });

        // Data
        const quotes = ref([
          'Stay curious, keep asking questions.',
          'The best way to predict future is to create it.',
          'Every moment is a fresh beginning.',
          'Chaos is just order waiting to be discovered.',
          'Your potential is endless.',
          'Keep being weird.',
          'Normal is overrated.',
          'Be energy you want to see in world.'
        ]);

        const catImage = ref('https://cataas.com/cat');
        const catLoading = ref(false);

        const rankings = ref([]);

        // Methods
        const toggleDarkMode = () => {
          darkMode.value = !darkMode.value;
          document.body.classList.toggle('dark', darkMode.value);
        };

        const toggleMusic = () => {
          musicPlaying.value = !musicPlaying.value;
          const music = document.getElementById('newMusic');
          if (musicPlaying.value) {
            music.play();
          } else {
            music.pause();
          }
        };

        const togglePanel = (panelName) => {
          panelOpen.value[panelName] = !panelOpen.value[panelName];
        };

        const nextQuote = () => {
          currentQuoteIndex.value = (currentQuoteIndex.value + 1) % quotes.value.length;
        };

        const nextCat = async () => {
          try {
            const response = await fetch('https://cataas.com/cat');
            if (!response.ok) {
              console.error('Failed to fetch cat:', response.status);
              return;
            }

            const blob = await response.blob();
            const imageUrl = URL.createObjectURL(blob);
            catImage.value = imageUrl;

            // Clean up previous object URL to avoid memory leaks
            if (imageUrl.startsWith('blob:')) {
              return () => URL.revokeObjectURL(imageUrl);
            }
          } catch (error) {
            console.error('Error fetching cat:', error);
          }
        };

        const onFart = () => {
          if (fartClicked.value) return;
          fartClicked.value = true;

          // Play sound
          const fart = document.getElementById('fartSound');
          if (fart) {
            fart.currentTime = 0;
            fart.play();
          }

          // Show confirmation
          setTimeout(() => {
            confirmationOpen.value = true;
          }, 300);

          // Explode effect
          fartExploded.value = true;
          setTimeout(() => {
            fartExploded.value = false;
            fartClicked.value = false;
          }, 500);

          // Randomize values
          tachValue.value = Math.floor(Math.random() * 100);
        };

        const onTurnMe = () => {
          const fart = document.getElementById('fartSound');
          if (fart) {
            fart.currentTime = 0;
            fart.play();
          }

          setTimeout(() => {
            confirmationOpen.value = true;
          }, 300);
        };

        const closeConfirmation = () => {
          confirmationOpen.value = false;
        };

        const closeMikaModal = () => {
          mikaModalOpen.value = false;
        };

        const createHeart = () => {
          const heart = document.createElement('div');
          heart.className = 'heart';
          heart.innerHTML = ['💖', '💕', '💗', '💓', '❤️'][Math.floor(Math.random() * 5)];
          heart.style.left = Math.random() * 100 + 'vw';
          heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 6000);
        };

        const onRouteChange = (route) => {
          currentRoute.value = route;
        };

        // Lifecycle
        onMounted(() => {
          // Set initial body class
          document.body.classList.toggle('dark', darkMode.value);

          // Heart animation interval
          setInterval(createHeart, 500);
        });

        return {
          // State
          currentRoute,
          darkMode,
          musicPlaying,
          feedOpen,
          currentQuoteIndex,
          catImage,
          catLoading,
          tachValue,
          fartClicked,
          fartExploded,
          panelOpen,
          mikaModalOpen,
          confirmationOpen,
          rankings,

          // Methods
          toggleDarkMode,
          toggleMusic,
          togglePanel,
          nextQuote,
          nextCat,
          onFart,
          onTurnMe,
          closeConfirmation,
          closeMikaModal,
          onRouteChange
        };
      },
      components: {
        MainApp,
        Router
      },
      template: `
        <div class="main-app">
          <Router
            :current-route="currentRoute"
            @route-change="onRouteChange"
          />

          <MainApp
            :dark-mode="darkMode"
            :music-playing="musicPlaying"
            :current-route="currentRoute"
            :current-quote-index="currentQuoteIndex"
            :current-cat-image="catImage"
            :tach-value="tachValue"
            :fart-clicked="fartClicked"
            :fart-exploded="fartExploded"
            :rankings="rankings"
            :panels="panelOpen"
            :mika-modal-open="mikaModalOpen"
            :confirmation-open="confirmationOpen"
            @toggle-dark-mode="toggleDarkMode"
            @toggle-music="toggleMusic"
            @toggle-panel="togglePanel"
            @next-quote="nextQuote"
            @new-cat="nextCat"
            @fart="onFart"
            @turn-me="onTurnMe"
            @close-confirmation="closeConfirmation"
            @route-change="onRouteChange"
          />
        </div>
      `
    }).mount('#app');
  </script>
</body>
</html>
