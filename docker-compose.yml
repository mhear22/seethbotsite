version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: test-nginx
    restart: unless-stopped
    ports:
      - "8081:80"    # Port 8081 on host maps to port 80 in container
      - "80:80"       # Port 80 on host maps to port 80 in container
    volumes:
      - /home/seethbotsite:/app
    environment:
      - NGINX_HOST=seethbot
      - NGINX_PORT=80
    command: nginx -g daemon off;
