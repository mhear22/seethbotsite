services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: seethbot-server
    restart: unless-stopped
    ports:
      - "8081:3000"    # Host 8081 → Container 3000
    volumes:
      - /home/seethbotsite:/app/seethbotsite:ro
      - seethbot-data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVE_ROOT=/app/seethbotsite/dist
    working_dir: /app/server

volumes:
  seethbot-data:

