version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: seethbot-server
    restart: unless-stopped
    ports:
      - "8081:3000"    # Host 8081 → Container 3000
    volumes:
      - /home/seethbotsite:/app/seethbotsite:ro
      - seethbot-data:/app/server/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SERVE_ROOT=/app/seethbotsite
    working_dir: /app/server
    depends_on:
      - nginx

  nginx:
    image: nginx:latest
    container_name: test-nginx
    restart: unless-stopped
    ports:
      - "80:8081"    # Host 80 → Container 8081
    volumes:
      - /home/seethbotsite:/home/seethbotsite:ro
      - /home/seethbotsite/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - NGINX_HOST=seethbot
      - NGINX_PORT=8081

volumes:
  seethbot-data:

