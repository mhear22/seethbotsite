version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: test-nginx
    restart: unless-stopped
    ports:
      - "8081:8081"    # Host 8081 → Container 8081
    volumes:
      - /home/seethbotsite:/app
      - /home/seethbotsite/nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Custom nginx config
    environment:
      - NGINX_HOST=seethbot
      - NGINX_PORT=8081
