version: '3.8'

services:
  # Seethbot Server (Full Stack)
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_HASH: ${GIT_HASH:-$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")}
        GIT_BRANCH: ${GIT_BRANCH:-$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "unknown")}
    image: seethbotsite-server:latest
    container_name: seethbot-server
    restart: unless-stopped
    ports:
      - "8081:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://seethbot:${POSTGRES_PASSWORD:-seethbot_secret_change_me}@postgres:5432/seethbot?schema=public}
      GIT_HASH: ${GIT_HASH:-unknown}
      GIT_BRANCH: ${GIT_BRANCH:-unknown}
    volumes:
      - seethbot-data:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - seethbot-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: seethbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: seethbot
      POSTGRES_USER: seethbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seethbot_secret_change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seethbot -d seethbot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seethbot-network

  # pgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: seethbot-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@seethbot.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - seethbot-network
    profiles:
      - admin

  # Backup Service
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: seethbot-postgres-backup
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: seethbot
      POSTGRES_USER: seethbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seethbot_secret_change_me}
      SCHEDULE: '@daily'
      BACKUP_KEEP_DAYS: 30
      BACKUP_KEEP_WEEKS: 8
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups/postgres:/backups
    depends_on:
      - postgres
    networks:
      - seethbot-network

volumes:
  postgres_data:
    driver: local
  seethbot-data:
    driver: local

networks:
  seethbot-network:
    driver: bridge
