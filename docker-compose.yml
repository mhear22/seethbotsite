version: '3.8'

services:
  nginx:
    image: nginx:latest
    container_name: test-nginx
    restart: unless-stopped
    ports:
      - "8081:8081"    # Host 8081 → Container 8081
      - "80:80"         # Host 80 → Container 80 (compatibility)
    volumes:
      - /home/seethbotsite:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro  # Custom nginx config
    environment:
      - NGINX_HOST=seethbot
      - NGINX_PORT=8081
