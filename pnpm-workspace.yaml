packages:
  - 'frontend'
  - 'backend'
  - 'apps/mech/frontend'
  - 'apps/tickets/frontend'
  - 'apps/datacenter/frontend'

# pnpm blocks dependency build scripts by default. Explicitly allow the native /
# build-critical ones and deny the dev-tool ones (openclaw CLI + its deps).
allowBuilds:
  esbuild: true
  bcrypt: true
  sharp: true
  prisma: true
  '@prisma/engines': true
  '@prisma/client': true
  protobufjs: true
  '@scarf/scarf': true
  unrs-resolver: true
  openclaw: false
  '@google/genai': false
  tree-sitter-bash: false

# We manage installs explicitly; don't re-run install before every `pnpm run`.
verifyDepsBeforeRun: false
